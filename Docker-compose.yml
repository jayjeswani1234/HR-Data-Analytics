version: "3.9"

services:
  hr-dashboard:
    build: .
    container_name: hr-dashboard

    ports:
      - "8501:8501"

    restart: unless-stopped

    volumes:
      - ./src/input_data:/app/src/input_data

    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"