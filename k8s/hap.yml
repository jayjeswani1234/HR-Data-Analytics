apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: hr-dashboard-hpa
  namespace: hr-dashboard

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hr-dash

  minReplicas: 2
  maxReplicas: 8

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
